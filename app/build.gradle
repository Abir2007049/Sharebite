plugins {
    alias(libs.plugins.android.application)
}

// Firebase configuration is developer-specific and must never be committed.
// When app/google-services.json is missing the project still builds; the app then
// shows a "Firebase not configured" screen instead of crashing.
def hasFirebaseConfig = file('google-services.json').exists()
if (hasFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("ShareBite: app/google-services.json not found. Building without Firebase configuration. See README.md > Firebase setup.")
}

android {
    namespace 'com.sharebite.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.sharebite.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "FIREBASE_CONFIGURED", hasFirebaseConfig.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.swiperefreshlayout
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.storage

    implementation libs.play.services.location
    implementation libs.glide
    implementation libs.gson
    implementation libs.osmdroid
    implementation libs.exifinterface

    testImplementation libs.junit
}
